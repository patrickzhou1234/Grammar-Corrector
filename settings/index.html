<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Grammar Corrector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="settings-container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo-icon">✨</div>
        <span class="title">Settings</span>
      </div>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Cookies Section -->
      <div class="section">
        <div class="section-header">🔐 Authentication</div>
        <p class="section-description">Enter your Gemini cookies from gemini.google.com (use incognito mode).</p>
        
        <div class="form-group">
          <label>__Secure-1PSID</label>
          <input type="password" id="psid" placeholder="Paste cookie value...">
        </div>

        <div class="form-group">
          <label>__Secure-1PSIDTS</label>
          <input type="password" id="psidts" placeholder="Paste cookie value...">
        </div>
      </div>

      <!-- Hotkey Section -->
      <div class="section">
        <div class="section-header">⌨️ Keyboard Shortcut</div>
        <p class="section-description">Click and press your desired key combination.</p>
        
        <div class="form-group">
          <label>Trigger Hotkey</label>
          <div class="hotkey-display" id="hotkeyDisplay" tabindex="0">
            <span id="hotkeyText">Ctrl+Alt+C</span>
            <span class="hotkey-hint">Click to record</span>
          </div>
        </div>
      </div>

      <!-- Opacity Section -->
      <div class="section">
        <div class="section-header">🎨 Overlay Opacity</div>
        <p class="section-description">Adjust the transparency of the overlay window.</p>
        
        <div class="slider-container">
          <input type="range" id="opacitySlider" min="30" max="100" value="92">
          <div class="slider-labels">
            <span>Transparent</span>
            <span id="opacityValue">92%</span>
            <span>Opaque</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn btn-save" id="saveBtn">💾 Save Settings</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
